services:
  - type: web
    name: caltg
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PYTHONPATH
        value: .
      - key: PORT
        value: 10000
databases:
  - name: caltg-db
    databaseName: caltg
    user: caltg_user